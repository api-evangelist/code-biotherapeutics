tools_manifest: mcp/code-biotherapeutics-mcp-tools-list.json
tools:
- name: GetBusinessDetails
  description: Returns business and site details for the site — timezone, email, phone, fax, address.
  required: []
  mutating: false
- name: SearchInSite
  description: Full-text search across the public site content.
  required:
  - searchTerm
  mutating: false
- name: SearchSiteApiDocs
  description: Returns the API documentation for the Wix business solutions installed on this site and
    how to call them.
  required:
  - searchTerm
  mutating: false
- name: BrowseWixRESTDocsMenu
  description: Browse the Wix REST API documentation menu hierarchy.
  required:
  - reason
  mutating: false
- name: ReadFullDocsArticle
  description: Fetches a complete article from the Wix developer documentation portal.
  required:
  - articleUrl
  mutating: false
- name: ReadFullDocsMethodSchema
  description: Fetches the full request/response schema for a Wix API method.
  required:
  - articleUrl
  - reason
  mutating: false
- name: GenerateVisitorToken
  description: Creates a new anonymous visitor session and returns a visitor access token.
  required: []
  mutating: false
- name: CallWixSiteAPI
  description: Calls a Wix REST API method on the visitor's behalf against this site.
  required:
  - visitorToken
  - url
  - method
  mutating: true
- name: ExecuteWixAPI
  description: Runs JavaScript against the Wix REST API for this site in a sandbox, on the visitor's behalf.
  required:
  - code
  - reason
  - hasMutations
  - sourceDocUrls
  - visitorToken
  mutating: true
scope_note: This is a website-content and site-commerce agent surface. It exposes no scientific, pipeline,
  clinical or 3DNA platform data — Code Biotherapeutics publishes no such API.
