aid: code-biotherapeutics
name: Code Biotherapeutics
description: 'Code Biotherapeutics (Code Bio) is a privately held genetic medicine company
  headquartered in Hatfield, Pennsylvania, developing targeted non-viral gene therapies for
  serious and life-threatening genetic diseases. Its proprietary 3DNA multivalent synthetic
  DNA delivery platform is engineered to address the dose-related toxicity, off-target effects,
  immunogenicity, cargo-size limits, bioavailability, re-dosing and manufacturing complexity
  that constrain viral vectors. The company advances an internal pipeline led by Duchenne
  Muscular Dystrophy and Type 1 Diabetes programs, with additional targeting research in lung,
  pancreas and liver, alongside partnership programs including a collaboration with Takeda.
  Code Bio is not a software vendor and publishes no developer program or REST/GraphQL API;
  its only machine-readable agent surface is the Wix-platform Model Context Protocol server
  and llms.txt served from its own corporate website host.'
