  description: 'The Model Context Protocol server that Code Biotherapeutics'' corporate website
    exposes at https://www.codebiotx.com/_api/mcp. It is the Wix platform site MCP server,
    served from the company''s own host and advertised in the company''s llms.txt. An
    anonymous tools/list returns nine tools with full JSON Schema inputs, covering business
    detail lookup, site search, Wix REST documentation browsing, visitor-token issuance and
    authenticated site API calls. This is a site-content and site-action surface, not a
    scientific or pipeline data API.'
